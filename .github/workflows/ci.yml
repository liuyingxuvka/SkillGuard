name: SkillGuard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-runtime:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: git config --global core.longpaths true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest "git+https://github.com/liuyingxuvka/FlowGuard.git@v0.69.5"
      - run: python -m pytest -q -p no:cacheprovider tests/test_fixed_preflight_units.py tests/test_compact_contract_cli.py

  consumer-projection:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: git config --global core.longpaths true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest "git+https://github.com/liuyingxuvka/FlowGuard.git@v0.69.5"
      - run: python -m pytest -q -p no:cacheprovider tests/test_compact_contract_cli.py tests/test_current_consumer_projection.py

  current-runtime-suite:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: git config --global core.longpaths true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest "git+https://github.com/liuyingxuvka/FlowGuard.git@v0.69.5"
      - run: python -m pytest -q -p no:cacheprovider tests/test_fixed_preflight_units.py tests/test_compact_contract_cli.py

  tag-release-identity:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify exact version tag and commit
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
