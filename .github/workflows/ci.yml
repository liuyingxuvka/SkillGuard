name: SkillGuard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLOWGUARD_PROVIDER: "git+https://github.com/liuyingxuvka/FlowGuard.git@v0.69.7"

jobs:
  compact-runtime:
    name: Compact runtime / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: git config --global core.longpaths true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest jsonschema "$env:FLOWGUARD_PROVIDER"
        shell: pwsh
      - run: python -m pytest -q -p no:cacheprovider tests/test_fixed_preflight_units.py
      - run: python -m pytest -q -p no:cacheprovider tests/test_compact_contract_cli.py

  consumer-projection:
    name: Consumer projection / ${{ matrix.os }}
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git config --global core.longpaths true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest jsonschema "$env:FLOWGUARD_PROVIDER"
        shell: pwsh
      - run: python -m pytest -q -p no:cacheprovider tests/test_current_consumer_projection.py tests/test_consumer_release_wire_protocol.py tests/test_target_installation.py

  current-runtime-suite:
    name: Full current suite (Windows 3.12)
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git config --global core.longpaths true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest jsonschema "$env:FLOWGUARD_PROVIDER"
        shell: pwsh
      - name: Run the one final full owner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\skillguard-evidence" | Out-Null
          python -m pytest -q --junitxml="$env:RUNNER_TEMP\skillguard-evidence\pytest-junit.xml"
      - name: Upload full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillguard-full-current-suite-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/skillguard-evidence/pytest-junit.xml
            .skillguard/**/*.json

  tag-release-identity:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact version tag and commit
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
